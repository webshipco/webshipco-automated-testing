# CircleCI: the suite against https://webship.co on every push: npm ci, the
# Playwright Chromium, a dry run for undefined and ambiguous steps, then the
# suite. Playwright 1.65 does not run on Ubuntu 20.04, so the job runs on the
# Node.js 24 image.

version: 2.1

jobs:
  webship-js:
    docker:
      - image: cimg/node:24.22
    resource_class: medium
    environment:
      FORCE_COLOR: "1"
      LAUNCH_URL: https://webship.co
      SLOW_MO: "0"
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps chromium
      - run:
          name: Check for undefined and ambiguous steps
          command: npm run test:dry-run
      - run:
          name: Run tests
          command: npm test
      - store_artifacts:
          path: tests/reports
      - store_artifacts:
          path: tests/screenshots

workflows:
  push:
    jobs:
      - webship-js
