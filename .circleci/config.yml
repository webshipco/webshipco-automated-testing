# CircleCI: runs only where this repository is followed by CircleCI. The
# same commands as .github/workflows/github-actions.yml: a dry run for
# undefined and ambiguous steps, then the suite against https://webship.co,
# on every push to main. A weekly run is a scheduled pipeline of the project
# (Project Settings > Triggers).

version: 2.1

jobs:
  webship-js:
    docker:
      - image: cimg/node:24.22
    resource_class: medium
    environment:
      FORCE_COLOR: "1"
      LAUNCH_URL: https://webship.co
      SLOW_MO: "0"
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps chromium
      - run:
          name: Check for undefined and ambiguous steps
          command: npm run test:dry-run
      - run:
          name: Run tests
          command: npm test
      - store_artifacts:
          path: tests/reports
      - store_artifacts:
          path: tests/screenshots

workflows:
  push:
    jobs:
      - webship-js:
          filters:
            branches:
              only: main
