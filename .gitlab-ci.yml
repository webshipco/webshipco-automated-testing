# GitLab CI: runs only where this repository is mirrored to GitLab.
# The same commands as .github/workflows/github-actions.yml: a dry run for
# undefined and ambiguous steps, then the suite against https://webship.co.
# A weekly run is a pipeline schedule (Build > Pipeline schedules).

image: node:24

variables:
  FORCE_COLOR: "1"
  LAUNCH_URL: "https://webship.co"
  SLOW_MO: "0"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

stages:
  - test

webship-js:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # One job at a time against the live site.
  resource_group: live-site
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run test:dry-run
    - npm test
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - tests/reports/
      - tests/screenshots/
