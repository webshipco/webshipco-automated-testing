# Bitbucket Pipelines: runs only where this repository is mirrored to
# Bitbucket. The same commands as .github/workflows/github-actions.yml: a dry
# run for undefined and ambiguous steps, then the suite against
# https://webship.co. A weekly run is a schedule of the custom "webship-js"
# pipeline (Pipelines > Schedules).

image: node:24

definitions:
  steps:
    - step: &webship-js
        name: webship-js on webship.co
        caches:
          - node
        script:
          - export FORCE_COLOR=1 SLOW_MO=0 LAUNCH_URL="${LAUNCH_URL:-https://webship.co}"
          - npm ci
          - npx playwright install --with-deps chromium
          - npm run test:dry-run
          - npm test
        artifacts:
          - tests/reports/**
          - tests/screenshots/**

pipelines:
  branches:
    main:
      - step: *webship-js
  pull-requests:
    '**':
      - step: *webship-js
  custom:
    webship-js:
      - step: *webship-js
